<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>Student Expense Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div><p class="eyebrow">Student Budget</p><h1>Expense Tracker</h1></div>
        <button id="resetData" class="secondary-btn" type="button">Reset Data</button>
      </header>

      <section class="overview panel" aria-labelledby="overview-title">
        <h2 id="overview-title">This month</h2>
        <div class="summary-grid">
          <article class="stat-card income-card"><span>Income</span><strong id="incomeTotal">£0.00</strong></article>
          <article class="stat-card expense-card"><span>Expenses</span><strong id="expenseTotal">£0.00</strong></article>
          <article class="stat-card balance-card"><span>Balance</span><strong id="balanceTotal">£0.00</strong></article>
        </div>
        <div class="budget-box">
          <div class="budget-row"><span>Monthly budget</span><strong id="budgetAmount">£1,200.00</strong></div>
          <div class="budget-row"><span>Spent this month</span><strong id="spentThisMonth">£0.00</strong></div>
          <div class="budget-progress" role="progressbar" aria-label="Monthly budget used" aria-valuemin="0" aria-valuemax="100"><div id="budgetProgressBar" class="budget-progress-bar"></div></div>
          <p id="budgetMessage" class="budget-message">You are within budget.</p>
        </div>
      </section>

      <div class="content-grid">
        <section class="panel form-panel" aria-labelledby="add-title">
          <h2 id="add-title">Add a transaction</h2>
          <form id="entryForm">
            <div class="field-group inline">
              <label><span>Type</span><select id="entryType" required><option value="expense">Expense</option><option value="income">Income</option></select></label>
              <label><span>Amount (£)</span><input id="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required /></label>
            </div>
            <div class="field-group inline">
              <label><span>Category</span><select id="category" required><option>Food</option><option>Transport</option><option>Books</option><option>Rent</option><option>Utilities</option><option>Entertainment</option><option>Study Supplies</option><option>Other</option></select></label>
              <label><span>Date</span><input id="date" type="date" required /></label>
            </div>
            <label><span>Description</span><input id="description" type="text" maxlength="80" placeholder="e.g. groceries, bus pass, textbook" required /></label>
            <button class="primary-btn" type="submit">Save transaction</button>
          </form>
        </section>

        <section class="panel history-panel" aria-labelledby="history-title">
          <div class="history-header"><h2 id="history-title">Transactions</h2><label class="filter-wrap" for="filterType"><span>Show</span><select id="filterType"><option value="all">All</option><option value="expense">Expenses</option><option value="income">Income</option></select></label></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Type</th><th>Category</th><th>Description</th><th>Date</th><th>Amount</th><th><span class="visually-hidden">Action</span></th></tr></thead>
              <tbody id="entriesBody"></tbody>
            </table>
          </div>
        </section>
      </div>
      <p class="privacy-note">Your entries are saved in this browser on this device.</p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
